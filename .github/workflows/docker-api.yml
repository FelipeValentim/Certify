name: Docker Build, Tag, and Push

on:
  push:
    branches:
      - main # Substitua pela branch desejada

jobs:
  docker-workflow:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - name: Checkout code
        uses: actions/checkout@v3

      # Login no DockerHub
      - name: Log in to DockerHub
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      # Build da imagem Docker
      - name: Build Docker Image
        run: |
          docker build \
            --build-arg STORAGE_ACCOUNT_ID="${{ secrets.STORAGE_ACCOUNT_ID }}" \
            --build-arg STORAGE_ACCESS_KEY_ID="${{ secrets.STORAGE_ACCESS_KEY_ID }}" \
            --build-arg STORAGE_SECRET_ACCESS_KEY="${{ secrets.STORAGE_SECRET_ACCESS_KEY }}" \
            --build-arg STORAGE_BUCKET_NAME="${{ secrets.STORAGE_BUCKET_NAME }}" \
            --build-arg CONNECTION_STRING="${{ secrets.CONNECTION_STRING }}" \
            -t docker-certify \
            -f certify-api/API/Dockerfile \
            certify-api

      # Tag da imagem
      - name: Tag Docker Image
        run: |
          docker tag docker-certify ${{ secrets.DOCKER_USERNAME }}/docker-certify-app:latest

      # Push da imagem para o DockerHub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/docker-certify-app:latest

      # Passo 6: Acionar o Deploy Hook no Render
      - name: Trigger Deploy
        run: |
          curl -X POST ${{ secrets.DEPLOY_HOOK }}
